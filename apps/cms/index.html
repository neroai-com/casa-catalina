<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalina Rentals — CMS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --canvas:#F1F0EA; --paper:#FBFAF6; --mist:#E6ECE8; --ink:#16302E; --stone:#4F625F;
    --line:#DAD8CF; --ocean:#0F6E7A; --ocean-deep:#0A5560; --terra:#C4693D; --terra-ink:#9E4E27;
    --brass:#B0863A; --sea:#7FA9AC;
    --serif:'Iowan Old Style','Palatino Linotype','Palatino','Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right)) 4rem max(18px,env(safe-area-inset-left))}
  header{display:flex;align-items:center;gap:.7rem;padding:1.1rem 0 1rem;flex-wrap:wrap}
  header h1{font-family:var(--serif);font-size:1.25rem;margin:0;flex:1;min-width:180px}
  header h1 small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra-ink);font-weight:600}
  button{font:inherit;cursor:pointer}
  .btn{border:0;border-radius:999px;padding:.6rem 1.15rem;font-weight:600;font-size:.9rem}
  .btn-teal{background:var(--ocean);color:#fff}
  .btn-teal:hover{background:var(--ocean-deep)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--stone)}
  .btn-ghost:hover{border-color:var(--stone)}
  .btn-terra{background:transparent;border:1px solid var(--terra);color:var(--terra-ink)}
  .btn-terra:hover{background:var(--terra);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  /* login */
  #login{max-width:360px;margin:14vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:20px;
    padding:2rem 1.6rem;text-align:center;box-shadow:0 18px 44px -20px rgba(16,48,46,.34)}
  #login h2{font-family:var(--serif);margin:.2rem 0 .3rem;font-size:1.4rem}
  #login .sub{font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra-ink);margin-bottom:1.2rem}
  #login input{width:100%;padding:.85rem .95rem;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin-bottom:.7rem}
  #login input:focus{outline:2px solid var(--sea)}
  #login .btn{width:100%}
  .err{color:var(--terra-ink);font-size:.86rem;min-height:1.2em;margin:.5rem 0 0}
  /* dashboard */
  #dash{display:none}
  .ptabs{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.2rem 0 1rem;border-bottom:1px solid var(--line)}
  .ptab{border:1px solid var(--line);background:var(--paper);color:var(--stone);border-radius:999px;padding:.5rem 1rem;font-weight:600;font-size:.88rem}
  .ptab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .ptab.add{border-style:dashed;color:var(--ocean)}
  h2.sec{font-family:var(--serif);font-size:1.15rem;margin:1.8rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
  h2.sec .count{font-family:var(--mono);font-size:.72rem;background:var(--ocean);color:#fff;border-radius:999px;padding:.1rem .55rem}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.8rem;
    box-shadow:0 8px 22px -14px rgba(16,48,46,.25)}
  .card .dates{font-family:var(--serif);font-weight:600;font-size:1.1rem}
  .card .dates .n{color:var(--stone);font-weight:400;font-size:.9rem}
  .card .meta{color:var(--stone);font-size:.9rem;margin:.25rem 0 .1rem}
  .card .meta a{color:var(--ocean);text-decoration:none;font-weight:600}
  .card .note{font-size:.88rem;color:var(--stone);font-style:italic;margin:.3rem 0 0}
  .card .when{font-family:var(--mono);font-size:.68rem;color:#9BA39E;margin-top:.35rem;letter-spacing:.05em}
  .card .acts{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
  .badge{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    border-radius:999px;padding:.18rem .6rem;vertical-align:2px;margin-left:.4rem}
  .badge.pending{background:#F4E8C8;color:#7A5B12}
  .badge.approved{background:#D9EBDD;color:#1E5B33}
  .badge.declined{background:#F0DCD2;color:var(--terra-ink)}
  .badge.owner{background:var(--mist);color:var(--ocean-deep)}
  .empty{color:var(--stone);font-size:.92rem;background:var(--mist);border-radius:12px;padding:.9rem 1rem}
  .addblock,.addprop{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:.9rem 1rem}
  .addblock input,.addprop input{padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .addblock input[type=text],.addprop input{flex:1;min-width:130px}
  .addblock input:focus,.addprop input:focus{outline:2px solid var(--sea)}
  /* content editor */
  .cform{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem}
  .cform .row{margin-bottom:.85rem}
  .cform label{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:.3rem}
  .cform input,.cform textarea{width:100%;padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  .cform input:focus,.cform textarea:focus{outline:2px solid var(--sea)}
  .cform textarea{min-height:64px;resize:vertical}
  .cform .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .cform .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
  @media(max-width:520px){.cform .grid2,.cform .grid3{grid-template-columns:1fr}}
  .cform .save{display:flex;align-items:center;gap:.8rem;margin-top:.4rem}
  .hint{font-size:.8rem;color:var(--stone)}
  #msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
    padding:.7rem 1.2rem;border-radius:999px;font-size:.9rem;transition:transform .3s;max-width:90vw;text-align:center;z-index:9}
  #msg.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h2>Catalina Rentals</h2>
    <div class="sub">Owner CMS</div>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn-teal" type="submit">Sign in</button>
    </form>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="dash">
    <header>
      <h1><small>Catalina Rentals</small>Owner CMS</h1>
      <button class="btn btn-ghost" id="refresh">Refresh</button>
      <button class="btn btn-ghost" id="logout">Sign out</button>
    </header>

    <div class="ptabs" id="ptabs"></div>

    <div id="addPropBox" style="display:none;margin-top:1rem">
      <form class="addprop" id="propForm">
        <input type="text" id="npSlug" placeholder="slug (e.g. casa-catalina)" pattern="[a-z0-9][a-z0-9-]{1,48}" required>
        <input type="text" id="npName" placeholder="Property name" maxlength="60" required>
        <button class="btn btn-teal" type="submit">Add property</button>
        <button class="btn btn-ghost" type="button" id="npCancel">Cancel</button>
      </form>
    </div>

    <div id="propBody"></div>
  </div>

</div>
<div id="msg" role="status"></div>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtShort(s){ var p=s.split('-'); return MON[+p[1]-1]+' '+(+p[2]); }
  function fmt(s){ var p=s.split('-'); return MON[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  function today(){ var d=new Date(),p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  var msgT;
  function toast(t){ var m=$('msg'); m.textContent=t; m.classList.add('show'); clearTimeout(msgT); msgT=setTimeout(function(){ m.classList.remove('show'); },3200); }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }

  var STATE={ props:{}, requests:[], blocks:[], fields:{}, current:null };

  function api(path,opts){
    opts=opts||{}; opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{}); opts.credentials='same-origin';
    return fetch(path,opts).then(function(r){
      if(r.status===401){ show(false); throw new Error('unauthorized'); }
      return r.json().then(function(j){ if(!r.ok)throw new Error(j.error||'error'); return j; });
    });
  }
  function show(authed){ $('login').style.display=authed?'none':''; $('dash').style.display=authed?'block':'none'; }

  function contactLink(c){
    var a=el('a',null,c);
    if(c.indexOf('@')>-1) a.href='mailto:'+c;
    else { var d=c.replace(/[^0-9+]/g,''); if(d.length>=7) a.href='tel:'+d; else return el('span',null,c); }
    return a;
  }

  function requestCard(r){
    var c=el('div','card');
    var dates=el('div','dates');
    dates.appendChild(document.createTextNode(fmtShort(r.checkIn)+' → '+fmtShort(r.checkOut)+' '));
    dates.appendChild(el('span','n','· '+r.nights+' night'+(r.nights>1?'s':'')));
    dates.appendChild(el('span','badge '+r.status,r.status));
    c.appendChild(dates);
    var m1=el('div','meta');
    m1.appendChild(document.createTextNode(r.name+' — '));
    m1.appendChild(contactLink(r.contact));
    c.appendChild(m1);
    c.appendChild(el('div','meta',
      r.adults+' adult'+(r.adults>1?'s':'')+
      (r.children?', '+r.children+' child'+(r.children>1?'ren':''):'')+
      (r.infants?', '+r.infants+' infant'+(r.infants>1?'s':''):'')+
      (r.pets?', '+r.pets+' pet'+(r.pets>1?'s':''):'')));
    if(r.note) c.appendChild(el('p','note','“'+r.note+'”'));
    c.appendChild(el('div','when','requested '+new Date(r.createdAt).toLocaleString()));
    var acts=el('div','acts');
    if(r.status!=='approved'){
      var ap=el('button','btn btn-teal','Approve & block dates');
      ap.onclick=function(){ ap.disabled=true;
        api('/api/admin/decide',{method:'POST',body:JSON.stringify({id:r.id,action:'approve'})})
          .then(function(){ toast('Approved — dates blocked on '+r.property+'.'); load(); })
          .catch(function(e){ toast(e.message); ap.disabled=false; }); };
      acts.appendChild(ap);
    }
    if(r.status!=='declined'){
      var de=el('button','btn btn-terra',r.status==='approved'?'Cancel & unblock':'Decline');
      de.onclick=function(){ de.disabled=true;
        api('/api/admin/decide',{method:'POST',body:JSON.stringify({id:r.id,action:'decline'})})
          .then(function(){ toast('Updated.'); load(); })
          .catch(function(e){ toast(e.message); de.disabled=false; }); };
      acts.appendChild(de);
    }
    c.appendChild(acts);
    return c;
  }

  function renderTabs(){
    var bar=$('ptabs'); bar.textContent='';
    var slugs=Object.keys(STATE.props).sort();
    slugs.forEach(function(s){
      var b=el('button','ptab'+(s===STATE.current?' on':''),STATE.props[s].name||s);
      b.onclick=function(){ STATE.current=s; renderTabs(); renderBody(); };
      bar.appendChild(b);
    });
    var add=el('button','ptab add','+ Add property');
    add.onclick=function(){ var bx=$('addPropBox'); bx.style.display=bx.style.display==='none'?'block':'none'; $('npSlug').focus(); };
    bar.appendChild(add);
  }

  function renderBody(){
    var body=$('propBody'); body.textContent='';
    var slug=STATE.current;
    if(!slug){ body.appendChild(el('div','empty','Add your first property to get started — its landing page, booking calendar, and requests all hang off the slug.')); return; }
    var t=today();

    // Requests
    var pend=STATE.requests.filter(function(r){ return r.property===slug&&r.status==='pending'; });
    var recent=STATE.requests.filter(function(r){ return r.property===slug&&r.status!=='pending'; }).slice(0,5);
    var h=el('h2','sec','Requests '); h.appendChild(el('span','count',String(pend.length))); body.appendChild(h);
    if(!pend.length&&!recent.length) body.appendChild(el('div','empty','No requests yet for this property.'));
    pend.concat(recent).forEach(function(r){ body.appendChild(requestCard(r)); });

    // Upcoming
    body.appendChild(el('h2','sec','Upcoming stays'));
    var up=STATE.requests.filter(function(r){ return r.property===slug&&r.status==='approved'&&r.checkOut>=t; })
      .sort(function(a,b){ return a.checkIn<b.checkIn?-1:1; });
    if(!up.length) body.appendChild(el('div','empty','No upcoming stays yet.'));
    up.forEach(function(r){
      var c=el('div','card'); var dd=el('div','dates');
      dd.appendChild(document.createTextNode(fmt(r.checkIn)+' → '+fmt(r.checkOut)+' '));
      dd.appendChild(el('span','n','· '+r.name));
      c.appendChild(dd); body.appendChild(c);
    });

    // Blocks
    body.appendChild(el('h2','sec','Blocked dates'));
    var blocks=STATE.blocks.filter(function(x){ return x.property===slug; });
    if(!blocks.length) body.appendChild(el('div','empty','Nothing blocked — the whole calendar is open.'));
    blocks.forEach(function(b){
      var c=el('div','card'); var dd=el('div','dates');
      dd.appendChild(document.createTextNode(fmtShort(b.start)+' → '+fmtShort(b.end)+' '));
      dd.appendChild(el('span','badge '+(b.source==='owner'?'owner':'approved'),b.source==='owner'?'owner block':'booking'));
      c.appendChild(dd);
      if(b.note) c.appendChild(el('div','meta',b.note));
      var acts=el('div','acts'); var rm=el('button','btn btn-terra','Unblock');
      rm.onclick=function(){ rm.disabled=true;
        api('/api/admin/blocks',{method:'DELETE',body:JSON.stringify({id:b.id})})
          .then(function(){ toast('Unblocked.'); load(); })
          .catch(function(e){ toast(e.message); rm.disabled=false; }); };
      acts.appendChild(rm); c.appendChild(acts); body.appendChild(c);
    });
    var bf=el('form','addblock'); bf.id='blockForm';
    var bs=document.createElement('input'); bs.type='date'; bs.required=true; bs.setAttribute('aria-label','Block start');
    var be=document.createElement('input'); be.type='date'; be.required=true; be.setAttribute('aria-label','Block end (checkout day)');
    var bn=document.createElement('input'); bn.type='text'; bn.placeholder='Note (e.g. family stay)'; bn.maxLength=120;
    var bb=el('button','btn btn-teal','Block dates'); bb.type='submit';
    bf.appendChild(bs); bf.appendChild(be); bf.appendChild(bn); bf.appendChild(bb);
    bf.onsubmit=function(e){ e.preventDefault();
      api('/api/admin/blocks',{method:'POST',body:JSON.stringify({property:slug,start:bs.value,end:be.value,note:bn.value})})
        .then(function(){ toast('Dates blocked.'); load(); })
        .catch(function(err){ toast(err.message); }); };
    body.appendChild(bf);

    // Landing page content editor
    body.appendChild(el('h2','sec','Landing page content'));
    var form=el('form','cform'); form.id='contentForm';
    var content=(STATE.props[slug]&&STATE.props[slug].content)||{};
    var groups=[['name','locationLine'],['heroTitle'],['heroLead'],['phone','email'],['sleeps','bedrooms','baths'],['ratesNote'],['bookLead'],['payNote']];
    var inputs={};
    groups.forEach(function(g){
      var row=el('div','row'+(g.length===2?' grid2':g.length===3?' grid3':''));
      g.forEach(function(k){
        var f=STATE.fields[k]; if(!f)return;
        var cell=el('div');
        var lb=el('label',null,f.label); lb.htmlFor='cf_'+k; cell.appendChild(lb);
        var inp=document.createElement(f.max>120?'textarea':'input');
        inp.id='cf_'+k; inp.maxLength=f.max; inp.value=content[k]||'';
        cell.appendChild(inp); row.appendChild(cell); inputs[k]=inp;
      });
      form.appendChild(row);
    });
    var save=el('div','save');
    var sb=el('button','btn btn-teal','Save content'); sb.type='submit';
    save.appendChild(sb);
    save.appendChild(el('span','hint','Changes appear on the live site immediately — no redeploy.'));
    form.appendChild(save);
    form.onsubmit=function(e){ e.preventDefault(); sb.disabled=true;
      var c={}; Object.keys(inputs).forEach(function(k){ c[k]=inputs[k].value; });
      api('/api/admin/property',{method:'POST',body:JSON.stringify({slug:slug,name:c.name||STATE.props[slug].name,content:c})})
        .then(function(){ toast('Saved — live on the site now.'); sb.disabled=false; load(); })
        .catch(function(err){ toast(err.message); sb.disabled=false; }); };
    body.appendChild(form);

    // Danger zone
    var del=el('button','btn btn-terra','Delete this property'); del.style.marginTop='1.4rem';
    del.onclick=function(){
      if(!confirm('Delete '+slug+' and all of its requests and blocks?'))return;
      api('/api/admin/property',{method:'DELETE',body:JSON.stringify({slug:slug})})
        .then(function(){ toast('Property deleted.'); STATE.current=null; load(); })
        .catch(function(e){ toast(e.message); }); };
    body.appendChild(del);
  }

  function load(){
    api('/api/admin/data').then(function(d){
      show(true);
      STATE.props=d.properties||{}; STATE.requests=d.requests||[]; STATE.blocks=d.blocks||[]; STATE.fields=d.contentFields||{};
      var slugs=Object.keys(STATE.props).sort();
      if(!STATE.current||!STATE.props[STATE.current]) STATE.current=slugs[0]||null;
      renderTabs(); renderBody();
    }).catch(function(){ /* 401 already routed to login */ });
  }

  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); $('loginErr').textContent='';
    api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})})
      .then(function(){ $('pw').value=''; load(); })
      .catch(function(e){ $('loginErr').textContent=e.message==='unauthorized'?'Wrong password.':e.message; });
  });
  $('logout').addEventListener('click',function(){
    api('/api/admin/logout',{method:'POST'}).then(function(){ show(false); }).catch(function(){ show(false); });
  });
  $('refresh').addEventListener('click',load);
  $('propForm').addEventListener('submit',function(e){
    e.preventDefault();
    var slug=$('npSlug').value.trim(), name=$('npName').value.trim();
    api('/api/admin/property',{method:'POST',body:JSON.stringify({slug:slug,name:name,content:{name:name}})})
      .then(function(){ toast('Property added.'); $('npSlug').value=$('npName').value=''; $('addPropBox').style.display='none'; STATE.current=slug; load(); })
      .catch(function(e){ toast(e.message); });
  });
  $('npCancel').addEventListener('click',function(){ $('addPropBox').style.display='none'; });

  load();
})();
</script>
</body>
</html>
