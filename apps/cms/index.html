<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalina Rentals — Property Manager</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<style>
  :root{
    --canvas:#F1F0EA; --paper:#FBFAF6; --mist:#E6ECE8; --ink:#16302E; --stone:#4F625F;
    --line:#DAD8CF; --ocean:#0F6E7A; --ocean-deep:#0A5560; --terra:#C4693D; --terra-ink:#9E4E27;
    --brass:#B0863A; --sea:#7FA9AC; --paid:#1E5B33;
    --serif:'Iowan Old Style','Palatino Linotype','Palatino','Book Antiqua',Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55}
  button{font:inherit;cursor:pointer}
  a{color:var(--ocean)}
  .btn{border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:.45rem}
  .btn-teal{background:var(--ocean);color:#fff}
  .btn-teal:hover{background:var(--ocean-deep)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--stone)}
  .btn-ghost:hover{border-color:var(--stone)}
  .btn-terra{background:transparent;border:1px solid var(--terra);color:var(--terra-ink)}
  .btn-terra:hover{background:var(--terra);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sea)}

  /* login */
  #login{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    gap:1.15rem;padding:1.4rem;overflow:auto;
    background:
      radial-gradient(54rem 36rem at 10% -8%, rgba(127,169,172,.34), transparent 62%),
      radial-gradient(46rem 32rem at 106% 110%, rgba(196,105,61,.17), transparent 60%),
      radial-gradient(30rem 22rem at 92% 6%, rgba(176,134,58,.15), transparent 65%),
      linear-gradient(180deg,var(--canvas),var(--mist))}
  #login::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(22,48,46,.05) 1px, transparent 1.4px);background-size:22px 22px}
  .logincard{position:relative;margin-top:auto;width:min(400px,100%);background:rgba(251,250,246,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(218,216,207,.95);border-radius:26px;padding:2.4rem 2rem 1.9rem;text-align:center;
    box-shadow:0 26px 70px -28px rgba(16,48,46,.5), inset 0 1px 0 rgba(255,255,255,.7)}
  #login h2{font-family:var(--serif);margin:.7rem 0 .25rem;font-size:1.6rem;letter-spacing:.01em}
  #login .sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--terra-ink)}
  .logindiv{width:56px;height:3px;border-radius:2px;margin:1.1rem auto 1.3rem;background:linear-gradient(90deg,var(--brass),var(--ocean))}
  .loginlabel{display:block;text-align:left;font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--stone);margin:0 0 .4rem .15rem}
  .pwwrap{position:relative;margin-bottom:.9rem}
  .pwwrap input{width:100%;padding:.78rem 3rem .78rem .95rem;border-radius:12px;font-size:1rem}
  .pwwrap input:focus{outline:2px solid var(--ocean);border-color:var(--ocean)}
  #pwToggle{position:absolute;top:50%;right:.45rem;transform:translateY(-50%);width:36px;height:36px;
    display:grid;place-items:center;background:none;border:0;border-radius:9px;color:var(--stone)}
  #pwToggle:hover{background:var(--mist);color:var(--ink)}
  #loginBtn{width:100%;justify-content:center;padding:.82rem 1rem;border-radius:12px;font-size:.98rem;
    background:linear-gradient(180deg,var(--ocean),var(--ocean-deep));box-shadow:0 12px 26px -12px rgba(15,110,122,.6);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
  #loginBtn:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(15,110,122,.7)}
  #loginBtn:disabled{transform:none}
  .loginfoot{position:relative;margin-bottom:auto;text-align:center}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
  .backlink{display:inline-flex;align-items:center;gap:.45rem;padding:.52rem 1rem;border:1px solid var(--line);border-radius:999px;
    background:rgba(251,250,246,.75);color:var(--ocean-deep);font-size:.88rem;font-weight:600;text-decoration:none;
    transition:border-color .2s,background .2s}
  .backlink:hover{border-color:var(--ocean);background:var(--paper)}
  .loginloc{font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);
    margin-top:.75rem}
  .err{color:var(--terra-ink);font-size:.86rem;min-height:1.2em;margin:.5rem 0 0}

  /* app shell */
  #app{display:none;min-height:100vh}
  .shell{display:flex;min-height:100vh}
  aside{width:230px;flex:none;background:var(--ink);color:#EAF0EE;display:flex;flex-direction:column;
    padding:1.2rem .9rem calc(1rem + env(safe-area-inset-bottom))}
  .brand{font-family:var(--serif);font-size:1.15rem;font-weight:600;color:#fff;padding:.2rem .55rem 1rem;
    display:flex;align-items:center;gap:.6rem}
  .brand .brandlogo{width:42px;height:42px;flex:none}
  .loginlogo{width:112px;height:112px;filter:drop-shadow(0 12px 20px rgba(16,48,46,.28))}
  .brand small{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sea);margin-bottom:.2rem}
  nav.side{display:flex;flex-direction:column;gap:.15rem}
  nav.side button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;color:rgba(234,240,238,.75);
    padding:.62rem .75rem;border-radius:10px;font-weight:600;font-size:.9rem;transition:background .2s,color .2s}
  nav.side button:hover{background:rgba(255,255,255,.07);color:#fff}
  nav.side button.on{background:var(--ocean);color:#fff}
  nav.side .spacer{flex:1}
  .sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:.3rem}
.sidefoot button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:rgba(234,240,238,.82);
    border-radius:10px;padding:.55rem .8rem;font-weight:600;font-size:.85rem;text-align:center;justify-content:center}
  .sidefoot button:hover{background:rgba(255,255,255,.12);color:#fff}
  main{flex:1;min-width:0;padding:1.6rem clamp(1rem,3vw,2.4rem) 4rem}
  .vhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
  .vhead h2{font-family:var(--serif);font-size:1.45rem;margin:0}
  .vhead .sub{color:var(--stone);font-size:.88rem}

  @media(max-width:820px){
    .shell{flex-direction:column}
    aside{width:100%;flex-direction:row;align-items:center;flex-wrap:wrap;gap:.4rem;padding:.7rem .8rem}
    .brand{padding:.1rem .4rem;font-size:1rem;flex:1}
    nav.side{flex-direction:row;overflow-x:auto;order:4;width:100%;padding:.3rem 0 .1rem;scrollbar-width:none}
    nav.side button{white-space:nowrap;padding:.5rem .7rem;font-size:.82rem}
    .sidefoot{margin:0;flex-direction:row;order:2}
    main{padding:1.1rem 14px 4rem}
  }

  /* cards & stats */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.8rem;
    box-shadow:0 8px 22px -14px rgba(16,48,46,.22)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1.4rem}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:.95rem 1rem}
  .tile .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
  .tile .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin-top:.15rem}
  .tile .v small{font-size:.95rem;color:var(--stone);font-weight:400}
  .tile.accent{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.accent .k{color:var(--sea)}
  h3.sec{font-family:var(--serif);font-size:1.1rem;margin:1.6rem 0 .6rem}
  .empty{color:var(--stone);font-size:.9rem;background:var(--mist);border-radius:12px;padding:.85rem 1rem}
  .badge{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:.16rem .55rem;vertical-align:2px}
  .badge.pending{background:#F4E8C8;color:#7A5B12}
  .badge.approved{background:#D9EBDD;color:#1E5B33}
  .badge.declined{background:#F0DCD2;color:var(--terra-ink)}
  .badge.owner{background:var(--mist);color:var(--ocean-deep)}
  .badge.paid{background:var(--paid);color:#fff}
  .badge.unpaid{background:#EEE9DC;color:#7A5B12}

  /* requests */
  .rq .dates{font-family:var(--serif);font-weight:600;font-size:1.08rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .rq .meta{color:var(--stone);font-size:.88rem;margin:.2rem 0 0}
  .rq .meta a{text-decoration:none;font-weight:600}
  .rq .note{font-size:.86rem;color:var(--stone);font-style:italic;margin:.3rem 0 0}
  .rq .when{font-family:var(--mono);font-size:.66rem;color:#9BA39E;margin-top:.3rem}
  .rq .acts{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap;align-items:center}
  .quote{background:var(--mist);border-radius:10px;padding:.5rem .8rem;font-size:.86rem;margin-top:.55rem;display:inline-block}
  .quote b{font-family:var(--serif);font-size:1rem}
  .payform{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-top:.6rem;background:var(--mist);border-radius:12px;padding:.6rem .7rem}
  .payform input{width:110px}
  .payform input.ref{width:150px}

  /* calendar view */
  .calwrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;max-width:560px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
  .calhead .t{font-family:var(--serif);font-weight:600;font-size:1.05rem}
  .calhead button{width:38px;height:38px;border:1px solid var(--line);background:var(--canvas);border-radius:9px}
  .caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .caldow span{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--stone);padding:.25rem 0;text-transform:uppercase}
  .calgrid .d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;position:relative;font-variant-numeric:tabular-nums}
  .calgrid .d.pad{visibility:hidden}
  .calgrid .d.past{color:#B9B6AC}
  .calgrid .d.booked{background:var(--ocean);color:#fff;font-weight:600}
  .calgrid .d.ownerblk{background:var(--brass);color:#fff;font-weight:600}
  .calgrid .d.today{outline:2px dashed var(--sea);outline-offset:-2px}
  .callegend{display:flex;gap:1rem;margin-top:.6rem;font-size:.74rem;color:var(--stone)}
  .callegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.3rem;font-style:normal}

  /* editor */
  .ed fieldset{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:.9rem 1rem 1rem;margin:0 0 1rem}
  .ed legend{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--terra-ink);padding:0 .4rem;font-weight:700}
  .ed .row{margin-bottom:.75rem}
  .ed label{display:block;font-size:.78rem;color:var(--stone);margin-bottom:.25rem;font-weight:600}
  .ed input,.ed textarea{width:100%}
  .ed textarea{min-height:60px;resize:vertical}
  .ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .ed .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
  @media(max-width:560px){.ed .grid2,.ed .grid3{grid-template-columns:1fr}}
  .savebar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--canvas) 70%,transparent);padding:.9rem 0 .4rem;display:flex;gap:.8rem;align-items:center}
  .hint{font-size:.78rem;color:var(--stone)}

  /* images */
  .drop{border:2px dashed var(--line);border-radius:16px;background:var(--paper);padding:1.6rem;text-align:center;color:var(--stone);
    cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:1rem}
  .drop:hover,.drop.over{border-color:var(--ocean);background:#fff}
  .drop b{color:var(--ocean)}
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
  .imcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .imcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--mist)}
  .imcard .cap{font-size:.74rem;color:var(--stone);padding:.4rem .55rem;min-height:2em}
  .imcard .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(16,48,46,.72);color:#fff;font-size:.95rem;line-height:1}
  .imcard .catsel{width:calc(100% - 1rem);margin:.1rem .5rem .5rem;font-size:.74rem;padding:.35rem .5rem;border-radius:8px}
  .imcat{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terra-ink);
    margin:1.5rem 0 .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
  .imcat:first-of-type{margin-top:1.2rem}
  .imcat small{color:var(--stone);font-weight:400;letter-spacing:.1em;margin-left:.4rem}
  .upbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
  .upbar label{font-size:.82rem;color:var(--stone);font-weight:600}
  .upbar select{font-size:.85rem;padding:.45rem .6rem}
  .upprog{font-size:.8rem;color:var(--stone);margin-bottom:.8rem;min-height:1.2em}

  /* master filter chips + fleet table */
  .pfbar{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.1rem}
  .pfbar button{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--paper);
    border-radius:999px;padding:.42rem .85rem;font-size:.82rem;font-weight:600;color:var(--stone);transition:border-color .2s,background .2s}
  .pfbar button:hover{border-color:var(--stone)}
  .pfbar button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;font-style:normal}
  .fleetwrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin-bottom:1.4rem}
  .fleet{width:100%;border-collapse:collapse;min-width:560px}
  .fleet th{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);text-align:left;padding:.7rem .9rem .5rem}
  .fleet td{padding:.55rem .9rem;border-top:1px solid var(--line);font-size:.88rem}
  .fleet tr[data-p]{cursor:pointer}
  .fleet tr[data-p]:hover td{background:var(--mist)}
  .fleet .pn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600}
  .pchip{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;color:var(--stone);font-weight:600;margin-left:.35rem}

  /* master calendar property bars */
  .calgrid .d{flex-direction:column;gap:1px;padding-top:.2rem}
  .calgrid .d .bars{display:flex;flex-direction:column;gap:2px;width:74%}
  .calgrid .d .pb{height:4px;border-radius:2px;display:block}
  .calgrid .d .pb.own{opacity:.5}
  .calgrid .d .pbmore{font-size:.5rem;line-height:1;color:var(--stone);font-style:normal;text-align:center}

  /* staged uploads */
  .stagewrap{background:var(--paper);border:1.5px solid var(--ocean);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1.2rem}
  .stagehead{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
  .stagehead h3{margin:0;font-family:var(--serif);font-size:1.05rem}
  .stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
  .stagecard{background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  .stagecard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--mist)}
  .stagecard input,.stagecard select{width:calc(100% - .8rem);margin:.4rem .4rem 0;font-size:.74rem;padding:.32rem .45rem;border-radius:8px}
  .stagecard .fin{margin-bottom:.45rem}
  .stagecard .del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(16,48,46,.72);color:#fff;line-height:1}
  .foldbtn{background:none;border:0;color:var(--ocean-deep);font-size:.72rem;padding:0 .55rem .5rem;text-decoration:underline;cursor:pointer;display:block;text-align:left}

  #msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;
    padding:.7rem 1.2rem;border-radius:999px;font-size:.9rem;transition:transform .3s var(--ease);max-width:92vw;text-align:center;z-index:9}
  #msg.show{transform:translateX(-50%) translateY(0)}
  .fade{animation:fadein .35s var(--ease)}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>

<div id="login">
  <div class="logincard fade">
    <img class="loginlogo" src="images/logo-casa-catalina.png" alt="Catalina Rentals — Vacation Rental" width="112" height="112">
    <h2>Catalina Rentals</h2>
    <div class="sub">Property Manager</div>
    <div class="logindiv" aria-hidden="true"></div>
    <form id="loginForm">
      <input class="vh" type="text" name="username" autocomplete="username" value="owner" readonly tabindex="-1" aria-hidden="true">
      <label class="loginlabel" for="pw">Password</label>
      <div class="pwwrap">
        <input type="password" id="pw" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" id="pwToggle" aria-label="Show password" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
            <line id="pwSlash" x1="4" y1="20" x2="20" y2="4" style="display:none"/>
          </svg>
        </button>
      </div>
      <button class="btn btn-teal" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </div>
  <div class="loginfoot fade">
    <a class="backlink" href="https://casa-catalina-avalon.vercel.app">&larr; Back to Casa Catalina</a>
    <div class="loginloc">Avalon &middot; Santa Catalina Island</div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside>
      <div class="brand"><img class="brandlogo" src="images/logo-casa-catalina.png" alt="" width="42" height="42"><span><small>Catalina Rentals</small>Property Manager</span></div>
      <nav class="side" id="nav"></nav>
      <div class="sidefoot">
        <button class="btn" id="addProp">+ Add property</button>
        <button class="btn" id="logout">Sign out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div id="msg" role="status"></div>
<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function p2(n){ return (n<10?'0':'')+n; }
  function fmtS(s){ var p=s.split('-'); return MON[+p[1]-1]+' '+(+p[2]); }
  function fmtL(s){ var p=s.split('-'); return MON[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
  function nightsOf(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000); }
  function money(n){ return '$'+(Math.round(n*100)/100).toLocaleString('en-US'); }
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
  window.addEventListener('pageshow',function(e){ if(e.persisted)location.reload(); });
  var msgT; function toast(t){ var m=$('msg'); m.textContent=t; m.classList.add('show'); clearTimeout(msgT); msgT=setTimeout(function(){ m.classList.remove('show'); },3200); }

  function api(path,opts){
    opts=opts||{}; opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{}); opts.credentials='same-origin';

      if(r.status===401){ show(false); throw new Error('unauthorized'); }

  function sync(){
    var prev=S.cur;

    if(prev&&S.cur!==prev){

    }

  // ---------- occupancy / revenue ----------
  function nightsInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function bookedNights(y,m,sourceFilter,blocks){
    var count=0, days=nightsInMonth(y,m);
    for(var d=1;d<=days;d++){
      var ds=y+'-'+p2(m+1)+'-'+p2(d);
      var hit=blocks.some(function(b){ return (!sourceFilter||b.source===sourceFilter)&&ds>=b.start&&ds<b.end; });
      if(hit)count++;
    }
    return count;
  }
  function occupancy(y,m,blocks){ return Math.round(100*bookedNights(y,m,null,blocks)/nightsInMonth(y,m)); }

  // ---------- Images ----------
  function imgUrl(id){ return '/api/public/'+S.cur+'/image?id='+id; }
  function downscale(file){
    return new Promise(function(resolve,reject){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){
        try{
          var MAX=1600, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,MAX/Math.max(w,h));
          var cv=document.createElement('canvas'); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          var q=0.82, out=cv.toDataURL('image/jpeg',q);
          while(out.length>1300000&&q>0.4){ q-=0.12; out=cv.toDataURL('image/jpeg',q); }
          URL.revokeObjectURL(url); resolve(out);
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
      img.src=url;
    });
  }

  function viewImages(m){
    m.appendChild(vhead('Images — '+pname(S.cur),
      el('span',null,'Stage photos, set each one\u2019s category and folder, then confirm. The live site places photos by category.')));
    m.appendChild(filterBar(false));
    var prog=el('div','upprog'); prog.id='upProg';
    var upbar=el('div','upbar');
    var ulab=el('label',null,'New photos start as'); ulab.htmlFor='upCat';
    var usel=catSelect(S.upCat||'additional photos'); usel.id='upCat';
    usel.onchange=function(){ S.upCat=usel.value; };
    var flab=el('label',null,'in folder'); flab.htmlFor='upFolder';
    var fin=document.createElement('input'); fin.id='upFolder'; fin.placeholder='(no folder)'; fin.maxLength=40;
    fin.value=S.upFolder||''; fin.setAttribute('list','folderlist');
    fin.onchange=function(){ S.upFolder=fin.value; };
    upbar.appendChild(ulab); upbar.appendChild(usel); upbar.appendChild(flab); upbar.appendChild(fin);
    m.appendChild(upbar);
    var dl=document.createElement('datalist'); dl.id='folderlist';
    propFolders().forEach(function(f){ var o=document.createElement('option'); o.value=f; dl.appendChild(o); });
    m.appendChild(dl);
    var drop=el('div','drop');
    drop.appendChild(el('div',null,'Drop photos here or '));
    var b=el('b',null,'browse to stage them'); drop.firstChild.appendChild(b);
    drop.appendChild(el('div','hint','Nothing uploads until you confirm — review categories and folders first'));
    var fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.multiple=true; fi.style.display='none';
    drop.appendChild(fi);
    drop.onclick=function(){ fi.click(); };
    drop.ondragover=function(e){ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave=function(){ drop.classList.remove('over'); };
    drop.ondrop=function(e){ e.preventDefault(); drop.classList.remove('over'); stageFiles([].slice.call(e.dataTransfer.files)); };
    fi.onchange=function(){ stageFiles([].slice.call(fi.files)); fi.value=''; };
    m.appendChild(drop); m.appendChild(prog);

    function stageFiles(files){
      if(S.uploading){ toast('Wait for the current upload to finish.'); return; }
      files=files.filter(function(f){ return /^image\//.test(f.type); });
      if(!files.length)return;
      var cap=24-(((prop()||{}).images)||[]).length-S.stage.length;
      if(files.length>cap){
        toast('Limit is 24 photos per property'+(cap>0?' — staging the first '+cap+'.':'.'));
        files=files.slice(0,Math.max(0,cap));
      }
      if(!files.length)return;
      prog.textContent='Preparing '+files.length+' photo'+(files.length>1?'s':'')+'\u2026';
      var stagedFor=S.cur, i=0;
      (function one(){
        if(i>=files.length||S.cur!==stagedFor){ if(S.view==='images'&&S.cur===stagedFor)renderView(); return; }
        var f=files[i++];
        downscale(f)
          .then(function(dataUrl){
            if(S.cur!==stagedFor)return; // property changed mid-decode — drop, don't misfile
            S.stage.push({dataUrl:dataUrl,caption:f.name.replace(/\.[^.]+$/,''),category:S.upCat||'additional photos',folder:S.upFolder||''});
          })
          .catch(function(){ toast('Could not read '+f.name+'.'); })
          .then(one);
      })();
    }

    if(S.stage.length){
      var w=el('div','stagewrap fade');
      var h=el('div','stagehead');
      h.appendChild(el('h3',null,'Ready to upload \u00b7 '+S.stage.length+' photo'+(S.stage.length>1?'s':'')));
      var btns=el('div');
      var go=el('button','btn btn-teal','Upload '+S.stage.length+' photo'+(S.stage.length>1?'s':'')); go.id='stageGo';
      var cl=el('button','btn btn-ghost','Clear'); cl.id='stageClear'; cl.style.marginLeft='.5rem';
      cl.onclick=function(){ if(S.uploading)return; S.stage=[]; renderView(); };
      btns.appendChild(go); btns.appendChild(cl); h.appendChild(btns); w.appendChild(h);
      var g=el('div','stagegrid');
      S.stage.forEach(function(st,i){
        var c=el('div','stagecard');
        var img=document.createElement('img'); img.src=st.dataUrl; img.alt=''; c.appendChild(img);
        var cap=document.createElement('input'); cap.value=st.caption; cap.maxLength=120; cap.placeholder='Caption';
        cap.setAttribute('aria-label','Caption'); cap.oninput=function(){ st.caption=cap.value; }; c.appendChild(cap);
        var cs=catSelect(st.category); cs.setAttribute('aria-label','Category');
        cs.onchange=function(){ st.category=cs.value; }; c.appendChild(cs);
        var fo=document.createElement('input'); fo.className='fin'; fo.value=st.folder; fo.maxLength=40; fo.placeholder='Folder (optional)';
        fo.setAttribute('list','folderlist'); fo.setAttribute('aria-label','Folder'); fo.oninput=function(){ st.folder=fo.value; }; c.appendChild(fo);
        var x=el('button','del','\u00d7'); x.setAttribute('aria-label','Remove from upload');
        x.onclick=function(){
          if(S.uploading)return;
          var idx=S.stage.indexOf(st); if(idx>-1)S.stage.splice(idx,1);
          renderView();
        }; c.appendChild(x);
        g.appendChild(c);
      });
      w.appendChild(g);
      go.onclick=function(){
        if(S.uploading)return;
        S.uploading=true; go.disabled=true; cl.disabled=true;
        var done=0, total=S.stage.length, pr=$('upProg'), slug=S.cur;
        (function next(){
          if(!S.stage.length){ S.uploading=false; if(pr)pr.textContent=''; toast('Uploaded '+done+' photo'+(done!==1?'s':'')+'.'); load(); return; }
          if(pr)pr.textContent='Uploading '+(done+1)+' of '+total+'\u2026';
          var st=S.stage[0];
          api('/api/admin/images',{method:'POST',body:JSON.stringify({slug:slug,dataUrl:st.dataUrl,category:st.category,folder:st.folder,caption:st.caption})})
            .then(function(){ S.stage.shift(); done++; next(); })
            .catch(function(e){ S.uploading=false; if(pr)pr.textContent='Upload stopped at photo '+(done+1)+': '+e.message+' \u2014 already-uploaded photos are saved.'; go.disabled=false; cl.disabled=false; });
        })();
      };
      m.appendChild(w);
    }

    var imgs=prop().images||[];
    if(!imgs.length){ if(!S.stage.length)m.appendChild(el('div','empty','No images yet — the site is using its built-in photos until you upload.')); return; }
    var fl=propFolders();
    if(S.folderFilter!=null&&S.folderFilter!==''&&fl.indexOf(S.folderFilter)<0)S.folderFilter=null;
    if(S.folderFilter===''&&!imgs.some(function(im){ return !im.folder; }))S.folderFilter=null;
    if(fl.length){
      var fb=el('div','pfbar');
      var hasUnfiled=imgs.some(function(im){ return !im.folder; });
      function fchip(label,val){
        var bb=el('button',(S.folderFilter===val)?'on':'',label);
        bb.setAttribute('data-folder',val===null?'all':(val||'unfiled'));
        bb.onclick=function(){ S.folderFilter=val; renderView(); };
        return bb;
      }
      fb.appendChild(fchip('All photos',null));
      fl.forEach(function(f){ fb.appendChild(fchip('\ud83d\udcc1 '+f,f)); });
      if(hasUnfiled)fb.appendChild(fchip('Unfiled',''));
      m.appendChild(fb);
    }
    var vis=(S.folderFilter==null)?imgs:imgs.filter(function(im){ return (im.folder||'')===S.folderFilter; });
    if(!vis.length){ m.appendChild(el('div','empty','No photos in this folder.')); return; }
    function card(im){
      var c=el('div','imcard fade');
      var img=document.createElement('img'); img.loading='lazy'; img.src=imgUrl(im.id); img.alt=im.caption||'';
      c.appendChild(img);
      c.appendChild(el('div','cap',im.caption||''));
      var csel=catSelect(im.category); csel.className='catsel'; csel.setAttribute('aria-label','Image category');
      csel.onchange=function(){
        api('/api/admin/images',{method:'PATCH',body:JSON.stringify({slug:S.cur,id:im.id,category:csel.value})})
          .then(function(){ toast('Moved to '+catLabel(csel.value)+'.'); load(); }).catch(function(e){ toast(e.message); load(); });
      };
      c.appendChild(csel);
      var fbn=el('button','foldbtn','\ud83d\udcc1 '+(im.folder||'No folder'));
      fbn.onclick=function(){
        var nv=prompt('Folder for this photo (leave empty for none):',im.folder||'');
        if(nv===null)return;
        api('/api/admin/images',{method:'PATCH',body:JSON.stringify({slug:S.cur,id:im.id,folder:nv})})
          .then(function(){ toast(nv?'Moved to folder \u201c'+nv+'\u201d.':'Removed from folder.'); load(); }).catch(function(e){ toast(e.message); });
      };
      c.appendChild(fbn);
      var del=el('button','del','\u00d7'); del.setAttribute('aria-label','Delete image');
      del.onclick=function(){
        if(!confirm('Delete this image?'))return;
        api('/api/admin/images',{method:'DELETE',body:JSON.stringify({slug:S.cur,id:im.id})})
          .then(function(){ toast('Image removed.'); load(); }).catch(function(e){ toast(e.message); });
      };
      c.appendChild(del);
      return c;
    }
    IMG_CATS.forEach(function(cat){
      var mine=vis.filter(function(im){ return (IMG_CATS.indexOf(im.category)>=0?im.category:'additional photos')===cat; });
      if(!mine.length)return;
      var h2=el('h3','imcat',catLabel(cat)); h2.appendChild(el('small',null,mine.length+(mine.length>1?' photos':' photo')));
      m.appendChild(h2);
      var grid=el('div','imgrid');
      mine.forEach(function(im){ grid.appendChild(card(im)); });
      m.appendChild(grid);
    });
  }

  // ---------- Settings ----------
  function viewSettings(m){
    m.appendChild(vhead('Settings — '+pname(S.cur), el('span',null,'Rates power quotes and revenue; the Whop link appears on approved requests.')));
    m.appendChild(filterBar(false));
    var st=prop().settings||{};
    var form=el('form','ed fade');
    var fs=document.createElement('fieldset'); var lg=document.createElement('legend'); lg.textContent='Billing & links'; fs.appendChild(lg);
    var defs=[['nightlyRate','Nightly rate (USD)','number'],['cleaningFee','Cleaning fee (USD)','number'],['maxNights','Maximum nights (default 30)','number'],['whopLink','Whop checkout link','url'],['lpUrl','Live site URL','url']];
    var inputs={};
    defs.forEach(function(d){
      var row=el('div','row'); var lb=el('label',null,d[1]); lb.htmlFor='st_'+d[0]; row.appendChild(lb);
      var inp=document.createElement('input'); inp.id='st_'+d[0]; inp.type=d[2]; if(d[2]==='number'){inp.step='0.01';inp.min='0';}
      inp.value=st[d[0]]||''; row.appendChild(inp); fs.appendChild(row); inputs[d[0]]=inp;
    });
    form.appendChild(fs);
    var bar=el('div','savebar');
    var sb=el('button','btn btn-teal','Save settings'); sb.type='submit'; bar.appendChild(sb);
    bar.appendChild(el('span','hint','Whop: paste any checkout/plan link — payments record manually either way.'));
    form.appendChild(bar);
    form.onsubmit=function(e){ e.preventDefault(); sb.disabled=true;
      var s2={}; Object.keys(inputs).forEach(function(k){ s2[k]=inputs[k].value; });
      api('/api/admin/property',{method:'POST',body:JSON.stringify({slug:S.cur,name:prop().name,settings:s2})})
        .then(function(){ toast('Settings saved.'); sb.disabled=false; load(); })
        .catch(function(e2){ toast(e2.message); sb.disabled=false; }); };
    m.appendChild(form);

    m.appendChild(el('h3','sec','Danger zone'));
    var del=el('button','btn btn-terra','Delete this property');
    del.onclick=function(){
      if(!confirm('Delete '+S.cur+' and all of its requests, blocks, and images?'))return;
      api('/api/admin/property',{method:'DELETE',body:JSON.stringify({slug:S.cur})})
        .then(function(){ toast('Property deleted.'); S.cur=null; load(); }).catch(function(e){ toast(e.message); });
    };
    m.appendChild(del);
  }

  // ---------- shell ----------
  function renderView(){
    var m=$('main'); m.textContent='';
    if(!Object.keys(S.props).length){ m.appendChild(vhead('Welcome')); m.appendChild(el('div','empty','Add your first property to get started.')); return; }
    ({overview:viewOverview,requests:viewRequests,calendar:viewCalendar,editor:viewEditor,images:viewImages,settings:viewSettings})[S.view](m);
  }
  function load(){
    api('/api/admin/data').then(function(d){
      show(true);
      S.props=d.properties||{}; S.requests=d.requests||[]; S.blocks=d.blocks||[]; S.fields=d.contentFields||{};
      sync();
      renderNav(); renderView();
    }).catch(function(){ /* 401 already routed */ });
  }
  $('addProp').addEventListener('click',function(){
    var slug=prompt('Slug for the new property (lowercase-with-dashes):'); if(!slug)return;
    var name=prompt('Property name:'); if(!name)return;
    api('/api/admin/property',{method:'POST',body:JSON.stringify({slug:slug.trim(),name:name.trim(),content:{name:name.trim()}})})
      .then(function(){ toast('Property added.'); S.filter=slug.trim(); load(); }).catch(function(e){ toast(e.message); });
  });
  var MAIN_SITE='https://casa-catalina-avalon.vercel.app';
  $('logout').addEventListener('click',function(){
    api('/api/admin/logout',{method:'POST'})
      .then(function(){ location.href=MAIN_SITE; })
      .catch(function(e){
        if(e&&e.message==='unauthorized'){ location.href=MAIN_SITE; return; }
        toast('Sign-out failed — check your connection and try again.');
      });
  });
  $('pwToggle').addEventListener('click',function(e){
    var pw=$('pw'), shown=pw.type==='text';
    pw.type=shown?'password':'text';
    this.setAttribute('aria-pressed',String(!shown));
    $('pwSlash').style.display=shown?'none':'';
    if(e.detail>0)pw.focus();
  });
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault(); $('loginErr').textContent='';
    var b=$('loginBtn'); b.disabled=true; b.textContent='Signing in…';
    var idle=function(){ b.disabled=false; b.textContent='Sign in'; };
    api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})})
      .then(function(){ idle(); $('pw').value=''; load(); })
      .catch(function(e2){ idle(); $('loginErr').textContent=e2.message==='unauthorized'?'Wrong password.':e2.message; $('pw').focus(); });
  });
  load();
})();
</script>
</body>
</html>
